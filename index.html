
<section id="gallery">
    <h2>🛩️ Aircraft Gallery</h2>
    <p>Explore aircraft from around the world. Select a category to see the aircraft collection.</p>

    <div class="cards">
        <button class="card gallery-button" onclick="showAircraft('military')">
            <h3>🛡️ Military Aircraft</h3>
            <p>Explore 10 military aircraft.</p>
        </button>

        <button class="card gallery-button" onclick="showAircraft('commercial')">
            <h3>✈️ Commercial Aircraft</h3>
            <p>Explore 10 commercial aircraft.</p>
        </button>

        <button class="card gallery-button" onclick="showAircraft('private')">
            <h3>🛩️ Private Aviation</h3>
            <p>Explore 10 private aircraft.</p>
        </button>
    </div>

    <div id="aircraft-list" style="margin-top:25px;"></div>
</section>

<style>
.gallery-button {
    color: white;
    font-family: Arial, sans-serif;
    text-align: left;
    cursor: pointer;
    width: 100%;
}

.aircraft-item {
    background: #0a1a2d;
    padding: 16px;
    margin: 10px 0;
    border: 1px solid #24496b;
    border-radius: 10px;
}

.aircraft-item h3 {
    color: #69c5ff;
    margin-top: 0;
}

.aircraft-item a {
    color: #57baff;
    font-weight: bold;
    text-decoration: none;
}
</style>

<script>
const aircraft = {
    military: [
        "F-16 Fighting Falcon",
        "F-15 Eagle",
        "F/A-18 Hornet",
        "Eurofighter Typhoon",
        "Dassault Rafale",
        "MiG-29",
        "Su-27",
        "A-10 Thunderbolt II",
        "C-130 Hercules",
        "P-3 Orion"
    ],

    commercial: [
        "Airbus A320",
        "Airbus A350",
        "Airbus A380",
        "Boeing 737",
        "Boeing 747",
        "Boeing 767",
        "Boeing 777",
        "Boeing 787 Dreamliner",
        "Embraer E175",
        "ATR 72"
    ],

    private: [
        "Cessna 172",
        "Cirrus SR22",
        "Beechcraft Bonanza",
        "Piper PA-28",
        "Diamond DA40",
        "Pilatus PC-12",
        "Daher TBM 960",
        "Gulfstream G650",
        "Bombardier Global 7500",
        "Embraer Phenom 300"
    ]
};

function showAircraft(category) {
    const list = document.getElementById("aircraft-list");
    const names = aircraft[category];

    const titles = {
        military: "🛡️ Military Aircraft",
        commercial: "✈️ Commercial Aircraft",
        private: "🛩️ Private Aviation"
    };

    list.innerHTML = "<h2>" + titles[category] + "</h2>";

    names.forEach((name, index) => {
        const searchUrl =
            "https://commons.wikimedia.org/w/index.php?search=" +
            encodeURIComponent(name) +
            "&title=Special:MediaSearch&type=image";

        list.innerHTML += `
            <div class="aircraft-item">
                <h3>${index + 1}. ${name}</h3>
                <a href="${searchUrl}" target="_blank"
                   rel="noopener noreferrer">
                   DOWNLOAD PHOTOS →
                </a>
            </div>
        `;
    });

    list.scrollIntoView({ behavior: "smooth", block: "start" });
}
</script>
